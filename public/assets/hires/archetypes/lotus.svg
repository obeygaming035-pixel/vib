<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="lotusAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#be185d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#35031b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#500724"/>
      <stop offset="50%" stop-color="#831843"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="crystalVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#fdf2f8"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glowLotus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <circle cx="250" cy="280" r="230" fill="url(#lotusAura)" />

  <!-- Floating Crystal Lotus Petals -->
  <path d="M 250 80 Q 230 40 250 20 Q 270 40 250 80 Z" fill="#ec4899" filter="url(#glowLotus)" />
  <path d="M 200 110 Q 170 80 180 60 Q 210 70 200 110 Z" fill="#f472b6" opacity="0.8" />
  <path d="M 300 110 Q 330 80 320 60 Q 290 70 300 110 Z" fill="#f472b6" opacity="0.8" />

  <!-- Kinetic Crystalline Geometric Halo -->
  <circle cx="250" cy="280" r="160" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="20,10" opacity="0.4" />
  <polygon points="250,90 390,280 250,470 110,280" fill="none" stroke="#f472b6" stroke-width="1" opacity="0.3"/>

  <!-- Sleek Stealth Bodysuit & Robe Fold -->
  <path d="M 160 380 L 250 350 L 340 380 L 390 580 L 110 580 Z" fill="url(#armorPink)" stroke="#ec4899" stroke-width="2" />
  <path d="M 200 370 Q 250 430 300 370 L 280 520 L 220 520 Z" fill="#290314" stroke="#f472b6" stroke-width="1.5" />

  <!-- Head & Ethereal Visor -->
  <path d="M 180 190 Q 250 120 320 190 L 330 300 L 250 360 L 170 300 Z" fill="#240413" stroke="#f472b6" stroke-width="2" />

  <!-- Crystalline Rose Visor -->
  <polygon points="190,225 310,225 295,265 250,280 205,265" fill="url(#crystalVisor)" filter="url(#glowLotus)" />
  <line x1="200" y1="245" x2="300" y2="245" stroke="#ffffff" stroke-width="2" />

  <text x="250" y="550" text-anchor="middle" font-family="monospace" font-size="16" font-weight="900" fill="#fbcfe8" letter-spacing="4">
    LOTUS BLOOM • 3,650 VP
  </text>
</svg>
