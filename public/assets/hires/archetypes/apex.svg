<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="apexAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#e9bf60" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#581c87" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0b1218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorSovereign" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="40%" stop-color="#2a124a"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#e9bf60"/>
    </linearGradient>
    <linearGradient id="radiantVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4655"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#ff4655"/>
    </linearGradient>
    <filter id="glowApex" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Radiant Energy Circle -->
  <circle cx="250" cy="280" r="230" fill="url(#apexAura)" />

  <!-- Cybernetic Floating Wolf Energy Shards -->
  <polygon points="90,180 120,130 110,195" fill="#c084fc" opacity="0.6" filter="url(#glowApex)" />
  <polygon points="410,180 380,130 390,195" fill="#c084fc" opacity="0.6" filter="url(#glowApex)" />
  <polygon points="60,320 85,290 80,340" fill="#e9bf60" opacity="0.5" filter="url(#glowApex)" />
  <polygon points="440,320 415,290 420,340" fill="#e9bf60" opacity="0.5" filter="url(#glowApex)" />

  <!-- Heavy Sovereign Pauldrons & Cyber Robes -->
  <path d="M 80 440 L 170 350 L 250 375 L 330 350 L 420 440 L 450 580 L 50 580 Z" fill="url(#armorSovereign)" stroke="#8b5cf6" stroke-width="2.5" />
  
  <!-- High Tactical Collar -->
  <polygon points="170,350 250,385 330,350 310,290 250,320 190,290" fill="#141e28" stroke="#e9bf60" stroke-width="1.5" />

  <!-- Angular Cybernetic Wolf Ears / Antennas -->
  <polygon points="150,220 110,80 190,150" fill="#241442" stroke="#8b5cf6" stroke-width="2" />
  <polygon points="135,170 120,105 165,145" fill="#ff4655" opacity="0.7" filter="url(#glowApex)" />

  <polygon points="350,220 390,80 310,150" fill="#241442" stroke="#8b5cf6" stroke-width="2" />
  <polygon points="365,170 380,105 335,145" fill="#ff4655" opacity="0.7" filter="url(#glowApex)" />

  <!-- Main Cybernetic Sovereign Helm / Faceplate -->
  <polygon points="160,160 250,110 340,160 360,260 250,335 140,260" fill="#0b1218" stroke="#8b5cf6" stroke-width="2.5" />

  <!-- Radiant Gold Crown Insignia Atop Helm -->
  <polygon points="210,110 250,55 290,110 270,125 250,90 230,125" fill="url(#goldCrown)" stroke="#fef08a" stroke-width="1.5" filter="url(#glowApex)" />
  <polygon points="185,130 205,85 220,120" fill="url(#goldCrown)" opacity="0.85" />
  <polygon points="315,130 295,85 280,120" fill="url(#goldCrown)" opacity="0.85" />

  <!-- Wolf Muzzle / Angular Armored Jaw -->
  <polygon points="190,240 250,225 310,240 280,315 250,330 220,315" fill="#190e30" stroke="#e9bf60" stroke-width="1.5" />
  
  <!-- Glowing Horizontal Tactical Visor & Wolf Eyes -->
  <polygon points="175,205 235,215 250,220 265,215 325,205 310,220 250,232 190,220" fill="url(#radiantVisor)" filter="url(#glowApex)" />
  
  <!-- Sharp Radiant Wolf Eye Slits -->
  <line x1="195" y1="205" x2="230" y2="212" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#glowApex)" />
  <line x1="305" y1="205" x2="270" y2="212" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" filter="url(#glowApex)" />

  <!-- Chest Power Core (Imperial Amethyst Jewel) -->
  <polygon points="250,420 275,455 250,490 225,455" fill="#8b5cf6" stroke="#e9bf60" stroke-width="2" filter="url(#glowApex)" />
  <circle cx="250" cy="455" r="5" fill="#ffffff" filter="url(#glowApex)" />

  <!-- Bottom Monospace Identity Text -->
  <text x="250" y="555" text-anchor="middle" font-family="monospace" font-size="16" font-weight="900" fill="#fef08a" letter-spacing="4">
    APEX SOVEREIGN • 11,000 VP
  </text>
</svg>
