<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" width="100%" height="100%">
  <defs>
    <radialGradient id="venomAura" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#047857" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armorGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#022c22"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="neonGreenVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glowVenom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atmospheric Background Glow -->
  <circle cx="250" cy="280" r="220" fill="url(#venomAura)" />

  <!-- Cyber Hex Grid Background Accents -->
  <g stroke="#10b981" stroke-width="1" opacity="0.2">
    <polygon points="250,50 300,80 300,140 250,170 200,140 200,80" fill="none"/>
    <polygon points="350,150 400,180 400,240 350,270 300,240 300,180" fill="none"/>
    <polygon points="150,150 200,180 200,240 150,270 100,240 100,180" fill="none"/>
  </g>

  <!-- Kinetic Toxic Waveforms -->
  <path d="M 50 450 Q 150 380 250 420 T 450 390" fill="none" stroke="#10b981" stroke-width="2" opacity="0.4" />
  <path d="M 80 480 Q 200 420 320 460 T 480 430" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.3" />

  <!-- Operative Torso & Tactical Street Armor -->
  <path d="M 160 380 L 250 350 L 340 380 L 390 580 L 110 580 Z" fill="url(#armorGreen)" stroke="#10b981" stroke-width="2" />
  
  <!-- Tactical Collar & Straps -->
  <path d="M 180 360 L 250 400 L 320 360 L 300 480 L 200 480 Z" fill="#021c16" stroke="#34d399" stroke-width="1.5" />
  <line x1="250" y1="400" x2="250" y2="520" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Tactical Shoulder Pauldrons -->
  <polygon points="110,390 170,370 180,450 90,480" fill="#033d2e" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="390,390 330,370 320,450 410,480" fill="#033d2e" stroke="#10b981" stroke-width="1.5"/>

  <!-- Neck & Lower Mask Base -->
  <path d="M 210 280 L 290 280 L 300 350 L 250 380 L 200 350 Z" fill="#021a14" stroke="#059669" stroke-width="1.5" />

  <!-- Respirator Filters with Neon Glow -->
  <circle cx="210" cy="330" r="16" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glowVenom)" />
  <circle cx="290" cy="330" r="16" fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glowVenom)" />
  <circle cx="250" cy="345" r="10" fill="#10b981" opacity="0.8"/>

  <!-- Cybernetic Head & Tactical Hood -->
  <path d="M 180 180 Q 250 110 320 180 L 330 290 L 250 360 L 170 290 Z" fill="#021f17" stroke="#10b981" stroke-width="2" />

  <!-- Toxic Cyber Visor (Luminous Neon) -->
  <polygon points="190,220 310,220 295,265 250,285 205,265" fill="url(#neonGreenVisor)" filter="url(#glowVenom)" />
  <line x1="200" y1="240" x2="300" y2="240" stroke="#ffffff" stroke-width="2" opacity="0.8" />
  <circle cx="230" cy="245" r="3" fill="#ffffff" />
  <circle cx="270" cy="245" r="3" fill="#ffffff" />

  <!-- Tactical Head Horns / Antennas -->
  <polygon points="175,170 150,120 185,150" fill="#10b981" opacity="0.9" />
  <polygon points="325,170 350,120 315,150" fill="#10b981" opacity="0.9" />

  <!-- Archetype Label & Crown Glyph -->
  <text x="250" y="550" text-anchor="middle" font-family="monospace" font-size="16" font-weight="900" fill="#6ee7b7" letter-spacing="4">
    VENOM PROTOCOL • 475 VP
  </text>
</svg>
